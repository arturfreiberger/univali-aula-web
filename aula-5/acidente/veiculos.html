<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denúncia de Acidente</title>
    <link rel="stylesheet" href="./assets/styles/global.css">
</head>
<body>
    <h2 class="titulo-acidente">Acidente de Trânsito sem Vítima</h2>

    <main class="registro-acidente">

        <aside class="etapas-registro">
            <div class="cabecalho-etapas">
                Etapas do Registro
            </div>
            <div class="etapa">
                <span class="numero">1</span>
                <span>Data e Hora do Fato</span>
            </div>
            <div class="etapa">
                <span class="numero">2</span>
                <span>Local do Fato</span>
            </div>
            <div class="etapa">
                <span class="numero">3</span>
                <span>Envolvidos</span>
            </div>
            <div class="etapa ativa">
                <span class="numero">4</span>
                <span>Veículos Envolvidos</span>
            </div>
            <div class="etapa">
                <span class="numero">5</span>
                <span>Relato do Fato</span>
            </div>
            <div class="etapa">
                <span class="numero">6</span>
                <span>Confirmação</span>
            </div>
        </aside>

        <section class="conteudo-etapa">
            <div class="card-formulario">
                <h3>Veículos envolvidos no acidente</h3>

                <form id="form-veiculo">
                    <div class="grid-veiculo">
                        <div class="grupo-campo">
                            <label for="placa-veiculo">
                                Placa <span class="obrigatorio">*</span>
                            </label>
                            <input
                                type="text"
                                id="placa-veiculo"
                                maxlength="7"
                                required
                            >
                        </div>

                        <div class="grupo-campo">
                            <label for="marca-veiculo">
                                Marca <span class="obrigatorio">*</span>
                            </label>
                            <input
                                type="text"
                                id="marca-veiculo"
                                required
                            >
                        </div>

                        <div class="grupo-campo">
                            <label for="modelo-veiculo">
                                Modelo <span class="obrigatorio">*</span>
                            </label>
                            <input
                                type="text"
                                id="modelo-veiculo"
                                required
                            >
                        </div>

                        <div class="grupo-campo">
                            <label for="cor-veiculo">
                                Cor
                            </label>
                            <input
                                type="text"
                                id="cor-veiculo"
                            >
                        </div>
                    </div>
                    <button
                        type="submit"
                        class="botao-secundario"
                    >
                        Adicionar veículo
                    </button>
                </form>

                <div id="lista-veiculos"></div>
            </div>


            <div class="navegacao-etapas">
                <a href="envolvidos.html" class="botao-etapa">
                    ◀ Etapa anterior
                </a>
                <button
                    type="button"
                    id="proxima-etapa-veiculos"
                    class="botao-etapa"
                >
                    Próxima etapa ▶
                </button>
            </div>
        </section>
    </main>

    <script type="text/javascript" src="./assets/scripts/denuncia.js"></script>
</body>
</html>
